<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Materias Inscritas - UniMatch</title>
  <link rel="stylesheet" href="css/mis_materias.css">
</head>
<body>
  <div class="container">
    <h1>Mis materias inscritas</h1>
    <p>Consulta tus materias activas y realiza acciones rápidas sobre cada una.</p>

    <div class="actions-top">
      <button class="btn-primary" data-action="go-materias">Ir a matricular materias</button>
      <button class="btn-secondary" data-action="go-crear-solicitud">Crear solicitud manual</button>
      <button class="btn-secondary" data-action="go-solicitudes">Ver solicitudes</button>
      <button class="btn-danger" data-action="logout">Cerrar sesión</button>
    </div>

    <div id="contenido"></div>
    <div id="mensaje" class="msg error"></div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mis_materias.page.js"></script>
</body>
</html>
