<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Materias Inscritas - UniMatch</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 30px;
    }
    .container{
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
    }
    h1{
      margin-top: 0;
      color: #1d3557;
    }
    p{
      color: #555;
    }
    .actions-top{
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    button{
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-primary{ background:#2a9d8f; color:#fff; }
    .btn-secondary{ background:#457b9d; color:#fff; }
    .btn-danger{ background:#6c757d; color:#fff; }
    .btn-cancel{ background:#e63946; color:#fff; }
    .btn-group{ background:#f4a261; color:#fff; }
    .btn-subject{ background:#6a4c93; color:#fff; }

    table{
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td{
      padding: 14px 12px;
      border-bottom: 1px solid #e9ecef;
      text-align: left;
      vertical-align: top;
    }
    th{
      background: #1d3557;
      color: white;
      font-weight: bold;
    }
    tr:hover{
      background: #f8f9fa;
    }
    .tag{
      display: inline-block;
      background: #d8f3dc;
      color: #1b4332;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }
    .row-actions{
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .empty{
      background: #fff3cd;
      color: #856404;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
    }
    .msg{
      margin-top: 16px;
      font-weight: bold;
    }
    .error{
      color: #c1121f;
    }

    @media (max-width: 768px){
      body{
        padding: 15px;
      }
      .container{
        padding: 18px;
      }
      table, thead, tbody, th, td, tr{
        display: block;
      }
      thead{
        display: none;
      }
      tr{
        margin-bottom: 14px;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 10px;
      }
      td{
        border: none;
        padding: 8px 0;
      }
      td::before{
        content: attr(data-label);
        font-weight: bold;
        display: block;
        color: #1d3557;
        margin-bottom: 4px;
      }
    }
  </style>
</head>
<body>
  <script src="js/auth.js"></script>
  <script>verificarSesion();</script>

  <div class="container">
    <h1>Mis materias inscritas</h1>
    <p>Consulta tus materias activas y realiza acciones rápidas sobre cada una.</p>

    <div class="actions-top">
      <button class="btn-primary" onclick="window.location.href='materias.html'">Ir a matricular materias</button>
      <button class="btn-secondary" onclick="window.location.href='crear_solicitud.html'">Crear solicitud manual</button>
      <button class="btn-secondary" onclick="window.location.href='consultar_solicitudes.html'">Ver solicitudes</button>
      <button class="btn-danger" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

    <div id="contenido"></div>
    <div id="mensaje" class="msg error"></div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const contenido = document.getElementById("contenido");
    const mensaje = document.getElementById("mensaje");

    function irConSolicitudPrellenada(tipo, item) {
      const params = new URLSearchParams({
        tipo_solicitud: tipo,
        grupo_origen: item.id_grupo,
        materia_origen: item.id_materia
      });

      window.location.href = `crear_solicitud.html?${params.toString()}`;
    }

    async function cargarMisMaterias() {
      contenido.innerHTML = "";
      mensaje.textContent = "";

      try {
        const data = await obtenerMisMaterias();

        if (!data.ok) {
          mensaje.textContent = data.mensaje || "No fue posible cargar las materias inscritas.";
          return;
        }

        const materias = data.materias || [];

        if (materias.length === 0) {
          contenido.innerHTML = `
            <div class="empty">
              No tienes materias inscritas en este momento.
            </div>
          `;
          return;
        }

        let html = `
          <table>
            <thead>
              <tr>
                <th>Materia</th>
                <th>Grupo</th>
                <th>Horario</th>
                <th>Estado</th>
                <th>Fecha matrícula</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
        `;

        materias.forEach(item => {
          const itemSeguro = encodeURIComponent(JSON.stringify(item));

          html += `
            <tr>
              <td data-label="Materia">${item.materia}</td>
              <td data-label="Grupo">${item.id_grupo}</td>
              <td data-label="Horario">${item.horario || "Sin horario registrado"}</td>
              <td data-label="Estado"><span class="tag">${item.estado}</span></td>
              <td data-label="Fecha matrícula">${item.fecha_matricula}</td>
              <td data-label="Acciones">
                <div class="row-actions">
                  <button class="btn-cancel" onclick="accionFila('${itemSeguro}','cancelacion')">Cancelar</button>
                  <button class="btn-group" onclick="accionFila('${itemSeguro}','cambio_grupo')">Cambio de grupo</button>
                  <button class="btn-subject" onclick="accionFila('${itemSeguro}','cambio_materia')">Cambio de materia</button>
                </div>
              </td>
            </tr>
          `;
        });

        html += `
            </tbody>
          </table>
        `;

        contenido.innerHTML = html;

      } catch (error) {
        console.error(error);
        mensaje.textContent = "Error de conexión con el servidor.";
      }
    }

    function accionFila(itemCodificado, tipo) {
      const item = JSON.parse(decodeURIComponent(itemCodificado));
      irConSolicitudPrellenada(tipo, item);
    }

    cargarMisMaterias();
  </script>
</body>
</html>
