<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar Solicitudes - UniMatch</title>
  <link rel="stylesheet" href="css/consultar_solicitudes.css">
</head>
<body>
  <div class="container">
    <h1>Mis solicitudes</h1>

    <div class="top-actions">
      <button class="btn-primary" data-action="new-request">Nueva solicitud</button>
      <button class="btn-secondary" data-action="logout">Cerrar sesión</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Tipo</th>
          <th>Grupo origen</th>
          <th>Grupo destino</th>
          <th>Materia origen</th>
          <th>Materia destino</th>
          <th>Estado</th>
          <th>Fecha</th>
        </tr>
      </thead>
      <tbody id="tabla_solicitudes">
        <tr>
          <td colspan="8">Cargando solicitudes...</td>
        </tr>
      </tbody>
    </table>

    <div id="mensaje" class="msg"></div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/consultar_solicitudes.page.js"></script>
</body>
</html>
