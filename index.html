<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - UniMatch</title>
  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      display:flex;
      min-height:100vh;
      background:#f4f4f4;
    }

    .left{
      width:60%;
      background:url('img/login.jpg') center center / cover no-repeat;
      min-height:100vh;
    }

    .right{
      width:40%;
      background:#f8f8f8;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px;
    }

    .login-box{
      width:100%;
      max-width:420px;
      background:#fff;
      padding:35px 30px;
      border-radius:12px;
      box-shadow:0 4px 18px rgba(0,0,0,.08);
    }

    .logo{
      text-align:center;
      margin-bottom:20px;
    }

    .logo h2{
      margin:0;
      color:#1d3557;
      font-size:26px;
    }

    .subtitle{
      margin:0 0 22px;
      text-align:center;
      color:#666;
    }

    .field{
      margin-bottom:16px;
    }

    .field label{
      display:block;
      margin-bottom:6px;
      font-weight:bold;
      color:#333;
    }

    .field input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:14px;
    }

    .btn-login{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#d4a100;
      color:#fff;
      font-size:16px;
      cursor:pointer;
      font-weight:bold;
    }

    .btn-login:hover{
      background:#b88d00;
    }

    .msg{
      margin-top:14px;
      text-align:center;
      font-weight:bold;
      min-height:20px;
    }

    .msg.error{
      color:#c1121f;
    }

    .msg.ok{
      color:#2b9348;
    }
  </style>
</head>
<body>
  <div class="left"></div>

  <div class="right">
    <div class="login-box">
      <div class="logo">
        <h2>UniMatch</h2>
      </div>

      <p class="subtitle">Ingreso a plataforma con credenciales</p>

      <form id="loginForm">
        <div class="field">
          <label for="correo">Usuario</label>
          <input type="email" id="correo" placeholder="correo@unimatch.com" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="********" required>
        </div>

        <button type="submit" class="btn-login">Ingresar</button>
      </form>

      <div id="mensaje" class="msg"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const mensaje = document.getElementById("mensaje");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      mensaje.textContent = "";
      mensaje.className = "msg";

      const correo = document.getElementById("correo").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!correo || !password) {
        mensaje.textContent = "Completa todos los campos.";
        mensaje.classList.add("error");
        return;
      }

      try {
        const data = await loginUsuario(correo, password);

        if (!data.ok) {
          mensaje.textContent = data.mensaje || "No fue posible iniciar sesión.";
          mensaje.classList.add("error");
          return;
        }

        localStorage.setItem("usuario", JSON.stringify(data.usuario));
        localStorage.setItem("token", data.token);

        mensaje.textContent = "Inicio de sesión exitoso.";
        mensaje.classList.add("ok");

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 500);

      } catch (error) {
        console.error(error);
        mensaje.textContent = "Error de conexión con el servidor.";
        mensaje.classList.add("error");
      }
    });
  </script>
</body>
</html>
