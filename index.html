<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - UniMatch</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  display:flex;
  height:100vh;
}

/* LADO IZQUIERDO (IMAGEN) */
.left{
  width:60%;
  background:url('img/login.jpg') center/cover no-repeat;
}

/* LADO DERECHO */
.right{
  width:40%;
  background:#f5f5f5;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-box{
  width:80%;
  max-width:350px;
}

.logo{
  text-align:center;
  margin-bottom:20px;
  font-weight:bold;
}

h2{
  font-weight:normal;
  color:#555;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-bottom:1px solid #ccc;
  background:transparent;
}

button{
  width:100%;
  padding:12px;
  background:#d4a100;
  color:#fff;
  border:none;
  border-radius:5px;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#b88d00;
}

.msg{
  margin-top:10px;
  text-align:center;
  color:red;
}
</style>
</head>

<body>

<div class="left"></div>

<div class="right">
  <div class="login-box">

    <div class="logo">
      <h2>Universidad de Cundinamarca</h2>
    </div>

    <h3>Ingreso a plataforma</h3>

    <form id="loginForm">
      <input type="email" id="correo" placeholder="Usuario" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <button type="submit">Ingresar</button>
    </form>

    <div id="mensaje" class="msg"></div>

  </div>
</div>

<script src="js/api.js"></script>

<script>
const form = document.getElementById("loginForm");
const mensaje = document.getElementById("mensaje");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const correo = document.getElementById("correo").value;
  const password = document.getElementById("password").value;

  const data = await loginUsuario(correo, password);

  if (!data.ok) {
    mensaje.textContent = data.mensaje;
    return;
  }

  localStorage.setItem("usuario", JSON.stringify(data.usuario));
  window.location.href = "dashboard.html";
});
</script>

</body>
</html>
