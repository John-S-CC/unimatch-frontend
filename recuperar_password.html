<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniMatch · Nueva contraseña</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page" data-public-page="true">
  <main class="auth-shell">
    <section class="auth-visual" aria-label="Nueva contraseña">
      <div class="auth-copy">
        <span class="hero-badge">Restablecimiento seguro</span>
        <h1>Crea una nueva contraseña para tu cuenta institucional.</h1>
        <p>El enlace es temporal y solo puede usarse una vez.</p>
      </div>
    </section>

    <section class="auth-card-wrap">
      <div class="auth-card">
        <a class="brand-link" href="index.html">
          <img src="img/logo-ucundinamarca.png" alt="Escudo institucional">
        </a>

        <h2>Nueva contraseña</h2>
        <p>Debe tener mínimo 8 caracteres, una mayúscula, una minúscula y un número.</p>

        <form id="resetForm" class="form-stack" novalidate>
          <div class="field">
            <label for="password">Nueva contraseña</label>
            <input type="password" id="password" placeholder="********" autocomplete="new-password" required>
          </div>

          <div class="field">
            <label for="confirmacion">Confirmar contraseña</label>
            <input type="password" id="confirmacion" placeholder="********" autocomplete="new-password" required>
          </div>

          <button type="submit" class="btn-primary">Actualizar contraseña</button>
          <p class="auth-help"><a href="index.html">Volver al inicio de sesión</a></p>
        </form>

        <div id="mensaje" class="msg" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app-ui.js"></script>
  <script src="js/recuperar_password.js"></script>
</body>
</html>
