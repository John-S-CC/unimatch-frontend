<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Solicitud - UniMatch</title>
  <link rel="stylesheet" href="css/crear_solicitud.css">
</head>
<body>
  <div class="container">
    <h1>Crear solicitud</h1>
    <p>Los cambios de grupo y de materia se envían como solicitud. La cancelación y la nueva inscripción se procesan de inmediato si cumplen las validaciones.</p>

    <form id="formSolicitud">
      <div class="row">
        <div class="field">
          <label for="tipo_solicitud">Tipo de solicitud</label>
          <select id="tipo_solicitud" required>
            <option value="">Seleccione...</option>
            <option value="cancelacion">Cancelación</option>
            <option value="cambio_grupo">Cambio de grupo</option>
            <option value="cambio_materia">Cambio de materia</option>
            <option value="nueva_inscripcion">Nueva inscripción</option>
          </select>
        </div>

        <div class="field" id="bloque_origen">
          <label for="origen_select">Materia y grupo de origen</label>
          <select id="origen_select">
            <option value="">Seleccione...</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="field" id="bloque_destino">
          <label for="destino_select">Opción de destino</label>
          <select id="destino_select">
            <option value="">Seleccione...</option>
          </select>
        </div>

        <div class="field">
          <label for="resumen_texto">Resumen</label>
          <div id="resumen_texto" class="info-box">
            La información seleccionada aparecerá aquí.
          </div>
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary">Procesar</button>
        <button type="button" class="btn-secondary" data-action="go-mis-materias">Mis materias</button>
        <button type="button" class="btn-secondary" data-action="go-solicitudes">Ver solicitudes</button>
        <button type="button" class="btn-danger" data-action="logout">Cerrar sesión</button>
      </div>

      <div id="mensaje" class="msg"></div>
    </form>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/crear_solicitud.page.js"></script>
</body>
</html>
