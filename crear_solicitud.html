<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Solicitud - UniMatch</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f6f8;
      margin:0;
      padding:30px;
    }

    .container{
      max-width:950px;
      margin:0 auto;
      background:#fff;
      padding:25px;
      border-radius:14px;
      box-shadow:0 4px 18px rgba(0,0,0,.08);
    }

    h1{
      margin-top:0;
      color:#1d3557;
    }

    p{
      color:#555;
      margin-bottom:25px;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
      margin-bottom:16px;
    }

    .field{
      display:flex;
      flex-direction:column;
    }

    label{
      margin-bottom:6px;
      font-weight:bold;
      color:#333;
    }

    select{
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:14px;
      background:#fff;
    }

    select:disabled{
      background:#f1f3f5;
      cursor:not-allowed;
    }

    .actions{
      display:flex;
      gap:12px;
      margin-top:20px;
      flex-wrap:wrap;
    }

    button{
      padding:12px 18px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:14px;
    }

    .btn-primary{ background:#2a9d8f; color:#fff; }
    .btn-secondary{ background:#457b9d; color:#fff; }
    .btn-danger{ background:#6c757d; color:#fff; }

    .msg{
      margin-top:16px;
      font-weight:bold;
    }

    .ok{
      color:#2b9348;
    }

    .error{
      color:#c1121f;
    }

    .info-box{
      background:#eef6ff;
      border:1px solid #cfe2ff;
      color:#1d3557;
      padding:14px;
      border-radius:10px;
      margin-top:10px;
      font-size:14px;
    }

    .hidden{
      display:none;
    }

    @media (max-width: 768px){
      body{
        padding:15px;
      }

      .container{
        padding:18px;
      }

      .row{
        grid-template-columns:1fr;
      }

      .actions{
        flex-direction:column;
      }

      button{
        width:100%;
      }
    }
  </style>
</head>
<body>
  <script src="js/auth.js"></script>
  <script>verificarSesion();</script>

  <div class="container">
    <h1>Crear solicitud</h1>
    <p>Selecciona el tipo de solicitud y completa la información desde las listas disponibles.</p>

    <form id="formSolicitud">
      <div class="row">
        <div class="field">
          <label for="tipo_solicitud">Tipo de solicitud</label>
          <select id="tipo_solicitud" required>
            <option value="">Seleccione...</option>
            <option value="cancelacion">Cancelación</option>
            <option value="cambio_grupo">Cambio de grupo</option>
            <option value="cambio_materia">Cambio de materia</option>
            <option value="nueva_inscripcion">Nueva inscripción</option>
          </select>
        </div>

        <div class="field" id="bloque_origen">
          <label for="origen_select">Materia y grupo de origen</label>
          <select id="origen_select">
            <option value="">Seleccione...</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="field" id="bloque_destino">
          <label for="destino_select">Opción de destino</label>
          <select id="destino_select">
            <option value="">Seleccione...</option>
          </select>
        </div>

        <div class="field">
          <label for="resumen_texto">Resumen</label>
          <div id="resumen_texto" class="info-box">
            La información seleccionada aparecerá aquí.
          </div>
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary">Guardar solicitud</button>
        <button type="button" class="btn-secondary" onclick="window.location.href='mis_materias.html'">Mis materias</button>
        <button type="button" class="btn-secondary" onclick="window.location.href='consultar_solicitudes.html'">Ver solicitudes</button>
        <button type="button" class="btn-danger" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>

      <div id="mensaje" class="msg"></div>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script>
    let inscritas = [];
    let disponibles = [];

    const tipo = document.getElementById("tipo_solicitud");
    const origenSelect = document.getElementById("origen_select");
    const destinoSelect = document.getElementById("destino_select");
    const mensaje = document.getElementById("mensaje");
    const form = document.getElementById("formSolicitud");
    const bloqueOrigen = document.getElementById("bloque_origen");
    const bloqueDestino = document.getElementById("bloque_destino");
    const resumenTexto = document.getElementById("resumen_texto");

    const params = new URLSearchParams(window.location.search);
    const tipoPre = params.get("tipo_solicitud");
    const grupoOrigenPre = params.get("grupo_origen");
    const materiaOrigenPre = params.get("materia_origen");

    function obtenerTextoOpcion(selectElement) {
      const option = selectElement.options[selectElement.selectedIndex];
      return option ? option.textContent : "";
    }

    function mostrarMensaje(texto, tipoClase) {
      mensaje.textContent = texto;
      mensaje.className = "msg " + tipoClase;
    }

    function limpiarMensaje() {
      mensaje.textContent = "";
      mensaje.className = "msg";
    }

    function actualizarVistaSegunTipo() {
      const tipoSolicitud = tipo.value;

      bloqueOrigen.classList.remove("hidden");
      bloqueDestino.classList.remove("hidden");
      origenSelect.disabled = false;
      destinoSelect.disabled = false;

      if (tipoSolicitud === "cancelacion") {
        bloqueOrigen.classList.remove("hidden");
        bloqueDestino.classList.add("hidden");
        destinoSelect.disabled = true;
        destinoSelect.innerHTML = '<option value="">No aplica</option>';
      }

      if (tipoSolicitud === "cambio_grupo") {
        bloqueOrigen.classList.remove("hidden");
        bloqueDestino.classList.remove("hidden");
        origenSelect.disabled = false;
        destinoSelect.disabled = false;
      }

      if (tipoSolicitud === "cambio_materia") {
        bloqueOrigen.classList.remove("hidden");
        bloqueDestino.classList.remove("hidden");
        origenSelect.disabled = false;
        destinoSelect.disabled = false;
      }

      if (tipoSolicitud === "nueva_inscripcion") {
        bloqueOrigen.classList.add("hidden");
        bloqueDestino.classList.remove("hidden");
        origenSelect.disabled = true;
        destinoSelect.disabled = false;
      }

      actualizarResumen();
    }

    function llenarOrigen() {
      origenSelect.innerHTML = '<option value="">Seleccione...</option>';

      inscritas.forEach(item => {
        const opt = document.createElement("option");
        opt.value = JSON.stringify({
          grupo_origen: Number(item.id_grupo),
          materia_origen: Number(item.id_materia)
        });
        opt.textContent = item.etiqueta;
        origenSelect.appendChild(opt);
      });
    }

    function llenarDestino() {
      destinoSelect.innerHTML = '<option value="">Seleccione...</option>';

      const tipoSolicitud = tipo.value;
      let origen = null;

      if (origenSelect.value) {
        origen = JSON.parse(origenSelect.value);
      }

      let lista = [...disponibles];

      if (tipoSolicitud === "cancelacion") {
        destinoSelect.innerHTML = '<option value="">No aplica</option>';
        destinoSelect.disabled = true;
        actualizarResumen();
        return;
      }

      if (tipoSolicitud === "cambio_grupo") {
        if (!origen) {
          destinoSelect.innerHTML = '<option value="">Primero selecciona origen...</option>';
          actualizarResumen();
          return;
        }

        lista = disponibles.filter(x =>
          Number(x.id_materia) === Number(origen.materia_origen) &&
          Number(x.id_grupo) !== Number(origen.grupo_origen)
        );
      }

      if (tipoSolicitud === "cambio_materia") {
        if (!origen) {
          destinoSelect.innerHTML = '<option value="">Primero selecciona origen...</option>';
          actualizarResumen();
          return;
        }

        lista = disponibles.filter(x =>
          Number(x.id_materia) !== Number(origen.materia_origen)
        );
      }

      if (tipoSolicitud === "nueva_inscripcion") {
        const materiasInscritas = inscritas.map(x => Number(x.id_materia));
        lista = disponibles.filter(x => !materiasInscritas.includes(Number(x.id_materia)));
      }

      if (lista.length === 0) {
        destinoSelect.innerHTML = '<option value="">No hay opciones disponibles</option>';
        actualizarResumen();
        return;
      }

      lista.forEach(item => {
        const opt = document.createElement("option");
        opt.value = JSON.stringify({
          grupo_destino: Number(item.id_grupo),
          materia_destino: Number(item.id_materia)
        });
        opt.textContent = item.etiqueta;
        destinoSelect.appendChild(opt);
      });

      destinoSelect.disabled = false;
      actualizarResumen();
    }

    function actualizarResumen() {
      const tipoSolicitud = tipo.value;
      const textoOrigen = obtenerTextoOpcion(origenSelect);
      const textoDestino = obtenerTextoOpcion(destinoSelect);

      if (!tipoSolicitud) {
        resumenTexto.textContent = "La información seleccionada aparecerá aquí.";
        return;
      }

      if (tipoSolicitud === "cancelacion") {
        resumenTexto.textContent = textoOrigen && textoOrigen !== "Seleccione..."
          ? `Vas a solicitar la cancelación de: ${textoOrigen}`
          : "Selecciona la materia y grupo de origen para cancelar.";
        return;
      }

      if (tipoSolicitud === "cambio_grupo") {
        if (!origenSelect.value) {
          resumenTexto.textContent = "Selecciona primero la materia y grupo de origen.";
          return;
        }

        if (!destinoSelect.value || destinoSelect.value === "" || textoDestino.includes("Primero selecciona") || textoDestino.includes("No hay opciones")) {
          resumenTexto.textContent = `Origen: ${textoOrigen}. Ahora selecciona el nuevo grupo de destino.`;
          return;
        }

        resumenTexto.textContent = `Solicitarás cambio de grupo desde: ${textoOrigen} hacia: ${textoDestino}`;
        return;
      }

      if (tipoSolicitud === "cambio_materia") {
        if (!origenSelect.value) {
          resumenTexto.textContent = "Selecciona primero la materia y grupo de origen.";
          return;
        }

        if (!destinoSelect.value || destinoSelect.value === "" || textoDestino.includes("Primero selecciona") || textoDestino.includes("No hay opciones")) {
          resumenTexto.textContent = `Origen: ${textoOrigen}. Ahora selecciona la materia/grupo de destino.`;
          return;
        }

        resumenTexto.textContent = `Solicitarás cambio de materia desde: ${textoOrigen} hacia: ${textoDestino}`;
        return;
      }

      if (tipoSolicitud === "nueva_inscripcion") {
        if (!destinoSelect.value || destinoSelect.value === "" || textoDestino.includes("No hay opciones")) {
          resumenTexto.textContent = "Selecciona una materia/grupo de destino para nueva inscripción.";
          return;
        }

        resumenTexto.textContent = `Solicitarás nueva inscripción en: ${textoDestino}`;
      }
    }

    async function cargarOpciones() {
      limpiarMensaje();

      try {
        const data = await obtenerOpcionesSolicitud();

        if (!data.ok) {
          mostrarMensaje(data.mensaje || "No fue posible cargar opciones.", "error");
          return;
        }

        inscritas = data.inscritas || [];
        disponibles = data.disponibles || [];

        llenarOrigen();
        actualizarVistaSegunTipo();
        llenarDestino();
      } catch (error) {
        console.error(error);
        mostrarMensaje("Error de conexión con el servidor.", "error");
      }
    }

    async function aplicarPreseleccion() {
      if (tipoPre) {
        tipo.value = tipoPre;
      }

      actualizarVistaSegunTipo();

      if (grupoOrigenPre && materiaOrigenPre) {
        const valorBuscado = JSON.stringify({
          grupo_origen: Number(grupoOrigenPre),
          materia_origen: Number(materiaOrigenPre)
        });

        for (const option of origenSelect.options) {
          if (option.value === valorBuscado) {
            origenSelect.value = valorBuscado;
            break;
          }
        }
      }

      llenarDestino();
      actualizarResumen();
    }

    tipo.addEventListener("change", () => {
      limpiarMensaje();
      if (tipo.value !== "nueva_inscripcion") {
        origenSelect.selectedIndex = 0;
      }
      destinoSelect.selectedIndex = 0;
      actualizarVistaSegunTipo();
      llenarDestino();
    });

    origenSelect.addEventListener("change", () => {
      limpiarMensaje();
      llenarDestino();
      actualizarResumen();
    });

    destinoSelect.addEventListener("change", () => {
      limpiarMensaje();
      actualizarResumen();
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      limpiarMensaje();

      let origen = null;
      let destino = null;

      if (origenSelect.value && origenSelect.value !== "") {
        try {
          origen = JSON.parse(origenSelect.value);
        } catch (error) {
          origen = null;
        }
      }

      if (destinoSelect.value && destinoSelect.value !== "" && !destinoSelect.value.includes("Primero selecciona")) {
        try {
          destino = JSON.parse(destinoSelect.value);
        } catch (error) {
          destino = null;
        }
      }

      const tipoSolicitud = tipo.value;

      const payload = {
        tipo_solicitud: tipoSolicitud,
        grupo_origen: origen ? origen.grupo_origen : null,
        materia_origen: origen ? origen.materia_origen : null,
        grupo_destino: destino ? destino.grupo_destino : null,
        materia_destino: destino ? destino.materia_destino : null
      };

      if (!tipoSolicitud) {
        mostrarMensaje("Debes seleccionar un tipo de solicitud.", "error");
        return;
      }

      if (tipoSolicitud === "cancelacion" && !origen) {
        mostrarMensaje("Debes seleccionar la materia y grupo que deseas cancelar.", "error");
        return;
      }

      if ((tipoSolicitud === "cambio_grupo" || tipoSolicitud === "cambio_materia") && !origen) {
        mostrarMensaje("Debes seleccionar la materia y grupo de origen.", "error");
        return;
      }

      if ((tipoSolicitud === "cambio_grupo" || tipoSolicitud === "cambio_materia" || tipoSolicitud === "nueva_inscripcion") && !destino) {
        mostrarMensaje("Debes seleccionar una opción de destino.", "error");
        return;
      }

      try {
        const data = await crearSolicitud(payload);

        if (!data.ok) {
          mostrarMensaje(data.mensaje || "No se pudo crear la solicitud.", "error");
          return;
        }

        mostrarMensaje(data.mensaje || "Solicitud creada correctamente.", "ok");
        form.reset();
        await cargarOpciones();
        await aplicarPreseleccion();
      } catch (error) {
        console.error(error);
        mostrarMensaje("Error de conexión con el servidor.", "error");
      }
    });

    async function iniciar() {
      await cargarOpciones();
      await aplicarPreseleccion();
    }

    iniciar();
  </script>
</body>
</html>
